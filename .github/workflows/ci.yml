name: Quilltale CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes ruff

      - name: Code Hygiene Check (pyflakes)
        run: |
          python -m pyflakes src/ tests/

      - name: Critical Syntax & Import Lint (ruff)
        run: |
          ruff check src/ --select F,E9

      - name: Static Reachability Audit
        run: |
          python scripts/reachability_audit.py

      - name: Document-Code Drift Check
        run: |
          python scripts/sync_doc_metrics.py --check

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ --durations=10
