version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: quilltale_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC API
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
